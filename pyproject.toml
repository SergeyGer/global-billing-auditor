[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-billing-audit"
version = "0.1.0"
description = "Streamlit mini-MVP for global payroll billing, employer-cost estimation, and invoice-compliance auditing."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sergey Gerasimov" }]
keywords = ["streamlit", "fintech", "billing", "payroll", "compliance", "invoice", "vat"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/SergeyGer/remote-billing-audit"
Repository = "https://github.com/SergeyGer/remote-billing-audit"
Issues = "https://github.com/SergeyGer/remote-billing-audit/issues"
Changelog = "https://github.com/SergeyGer/remote-billing-audit/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
